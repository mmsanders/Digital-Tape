; firmware/bench — WP-17 bench firmware (contract FW-1, docs/WP17-FIRMWARE-CONTRACT.md).
;
; Toolchain pins (FW-1 §3). PlatformIO Core itself is pinned where it is
; installed: tools/requirements.txt here, used by CI and by the README.
; The platform and every package it pulls are pinned to exact versions so a
; rebuild a year from now gets the same compiler and the same Teensy core.

[platformio]
default_envs = teensy41

[env]
platform = platformio/teensy@6.0.0
; Exact package pins: Teensyduino 1.62 core and loader, GCC 15.2.1 for ARM.
platform_packages =
    platformio/framework-arduinoteensy@1.162.0
    platformio/tool-teensy@1.162.0
    platformio/toolchain-gccarmnoneeabi-teensy@1.150201.0
framework = arduino
board = teensy41
; USB serial for the golden mode and the status lines; a map file for the
; F2 size gate (tools/size_gate.py).
build_flags = -DUSB_SERIAL -Wl,-Map,$BUILD_DIR/firmware.map
; The engine and the shared layout code are local libraries (lib/), so they
; get their own flags: -Werror and the desktop warning set for the engine.
lib_ldf_mode = chain
lib_deps =
    tape_engine
    tape_layout
    Audio
    SD
    SdFat
    SPI
    Wire
    SerialFlash

[env:teensy41]

; F2 negative controls. CI builds each and requires tools/size_gate.py to FAIL
; on it, for its own reason. Never flash either.
;
; RAM: the instance reserve 16 KiB larger (src/fw_storage.c), which takes the
; counted RAM over 200 KiB.
[env:teensy41_ctl_ram]
build_flags = ${env.build_flags} -DFW_SIZE_GATE_CONTROL=1

; .rodata: the engine archive built with a 33 KiB static force-included
; (controls/gate_rodata.h, by lib/tape_engine/gate_control.py).
[env:teensy41_ctl_rodata]
build_flags = ${env.build_flags} -DFW_SIZE_GATE_RODATA_CONTROL=1
