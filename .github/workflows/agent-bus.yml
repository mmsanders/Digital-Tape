name: Agent Bus controller
run-name: Agent Bus · ${{ inputs.command || 'install' }} · ${{ inputs.request_id || github.sha }}

on:
  push:
    branches: [main]
    paths: ['.github/agent-bus/**', '.github/workflows/agent-bus.yml', 'tools/agent-bus/**']
  workflow_dispatch:
    inputs:
      command:
        description: Controller command (authorize requires Michael and protected approval)
        required: true
        type: choice
        options: [reconcile, authorize, ready, claim, wait, return, block, close-child, pm-claim, pm-close, abort]
      request_id:
        description: Unique idempotency key; retain on transport retries
        required: true
        type: string
      payload:
        description: JSON command arguments; never include secrets
        required: true
        default: '{}'
        type: string

permissions:
  contents: read

jobs:
  install:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pages: read
    concurrency:
      group: agent-bus-ledger-writer
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/agent-bus/bus.py install
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python3 tools/agent-bus/bus.py inspect
        env:
          GH_TOKEN: ${{ github.token }}

  preflight:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      actions: read
    outputs:
      digest: ${{ steps.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: plan
        run: python3 tools/agent-bus/bus.py preflight
        env:
          GH_TOKEN: ${{ github.token }}
          BUS_COMMAND: ${{ inputs.command }}
          BUS_PAYLOAD: ${{ inputs.payload }}
          BUS_ACTOR: ${{ github.triggering_actor }}

  execute:
    needs: preflight
    runs-on: ubuntu-latest
    # Missing/unprotected human environment is rejected in preflight, never silently created.
    environment: ${{ inputs.command == 'authorize' && 'michael-round-gate' || 'agent-bus-control' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    concurrency:
      group: agent-bus-ledger-writer
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 tools/agent-bus/bus.py execute
        env:
          GH_TOKEN: ${{ github.token }}
          BUS_COMMAND: ${{ inputs.command }}
          BUS_PAYLOAD: ${{ inputs.payload }}
          BUS_ACTOR: ${{ github.triggering_actor }}
          BUS_REQUEST_ID: ${{ inputs.request_id }}
          BUS_APPROVED_DIGEST: ${{ needs.preflight.outputs.digest }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bus-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: bus-receipt.json
          if-no-files-found: ignore
