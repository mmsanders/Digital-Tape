name: READ-1 exact-head qualification
on:
  pull_request:
    paths:
      - 'engine/**'
      - 'tests/playback_readonly_adapter/**'
      - 'tests/playback_readonly_r1/**'
      - '.github/workflows/read1-qualification.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: read1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'software/409-playback-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Build, full canonical run, shipping equivalence, causal controls and replay
        run: python3 -B tests/playback_readonly_adapter/qualify.py --out "$RUNNER_TEMP/read1"
      - name: Publish hashed evidence release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          tag="evidence-read1-$head"
          gh release create "$tag" --target "$head" --title "READ-1 evidence $head" --notes "Actual Product observations and controls on this exact held head. Independent READ-2 disposition remains required." "$RUNNER_TEMP/read1/evidence.tar.gz" "$RUNNER_TEMP/read1/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: read1-exact-head-manifests
          path: |
            ${{ runner.temp }}/read1/provenance.json
            ${{ runner.temp }}/read1/run/manifest.json
            ${{ runner.temp }}/read1/controls/manifest.json
            ${{ runner.temp }}/read1/absence-result.json
            ${{ runner.temp }}/read1/SHA256SUMS
