name: READ-1 exact-head qualification
on:
  push:
    branches: ['software/415-readopt-binding']
  pull_request:
    paths:
      - 'engine/**'
      - 'tests/playback_readonly_adapter/**'
      - 'tests/playback_readonly_r1/**'
      - '.github/workflows/read1-qualification.yml'
      - 'tools/read1-carry.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: read1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'software/409-playback-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Build, full canonical run, shipping equivalence, causal controls and replay
        run: python3 -B tests/playback_readonly_adapter/qualify.py --out "$RUNNER_TEMP/read1"
      - name: Publish hashed evidence release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          tag="evidence-read1-$head"
          gh release create "$tag" --target "$head" --title "READ-1 evidence $head" --notes "Actual Product observations and controls on this exact held head. Independent READ-2 disposition remains required." "$RUNNER_TEMP/read1/evidence.tar.gz" "$RUNNER_TEMP/read1/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: read1-exact-head-manifests
          path: |
            ${{ runner.temp }}/read1/provenance.json
            ${{ runner.temp }}/read1/run/manifest.json
            ${{ runner.temp }}/read1/controls/manifest.json
            ${{ runner.temp }}/read1/absence-result.json
            ${{ runner.temp }}/read1/SHA256SUMS

  authority-carry:
    if: github.head_ref == 'software/412-read1-authority' || github.head_ref == 'software/415-readopt-binding' || github.ref == 'refs/heads/software/415-readopt-binding'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Authenticate original binaries and replay against corrected publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/read1-carry.py --out "$RUNNER_TEMP/read1-carry"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: read1-authority-carry-binding
          path: |
            ${{ runner.temp }}/read1-carry/binding.json
            ${{ runner.temp }}/read1-carry/corrected-oracle-replay/manifest.json
          if-no-files-found: warn

  epoch-binding:
    if: github.head_ref == 'software/415-readopt-binding' || github.ref == 'refs/heads/software/415-readopt-binding'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Published asset, transition and checker controls
        run: |
          python3 -B tests/playback_regression_epoch/selftest.py
          python3 -B tests/playback_regression_epoch/asset.py --destination "$RUNNER_TEMP/readopt-issued"
          mkdir -p "$RUNNER_TEMP/readopt-final"
          python3 -B tests/playback_regression_epoch/check.py transition --root "$RUNNER_TEMP/readopt-issued" > "$RUNNER_TEMP/readopt-final/transition.json"
      - name: Six exact bindings, old replay, green benign and seven causal mutations
        run: python3 -B tools/ci/readopt-mutations.py --out "$RUNNER_TEMP/readopt-final/campaign"
      - name: Accepted-binding controls
        run: |
          make -C tests/crossrun_wp08_adapter all
          make -C tests/sequential_wp06_adapter all
          python3 -B tools/ci/verify-engine-regression-gate.py > "$RUNNER_TEMP/readopt-final/accepted-binding-controls.log"
      - name: Final identity and unchanged integrity/resource/golden checks
        run: |
          tools/fetch-evidence.sh
          python3 -B tools/ci/audit-evidence-integrity.py 3da384bda1eb0c82e51a7adcd7c47156e6c3d494 > "$RUNNER_TEMP/readopt-final/integrity.log"
          python3 -B tools/ci/audit-product-evidence-pins.py > "$RUNNER_TEMP/readopt-final/pins.log"
          tools/ci/all.sh > "$RUNNER_TEMP/readopt-final/gates.log"
          git rev-parse HEAD HEAD^{tree} HEAD:engine > "$RUNNER_TEMP/readopt-final/executed-git-identities.txt"
      - name: Retain hashed actual final-head evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          tar -czf "$RUNNER_TEMP/readopt-final.tar.gz" -C "$RUNNER_TEMP" readopt-final
          sha256sum "$RUNNER_TEMP/readopt-final.tar.gz" > "$RUNNER_TEMP/readopt-final.SHA256SUMS"
          gh release create "evidence-readopt-415-$head" --target "$head" --title "READOPT-D10-1 binding evidence $head" --notes "Actual replacement-head bindings, historical replay and causal mutation observations. Independent final READ-2 and all required CI remain necessary." "$RUNNER_TEMP/readopt-final.tar.gz" "$RUNNER_TEMP/readopt-final.SHA256SUMS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readopt-final-causal-evidence
          path: ${{ runner.temp }}/readopt-final
          if-no-files-found: warn
