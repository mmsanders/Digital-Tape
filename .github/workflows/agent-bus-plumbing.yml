name: Agent Bus plumbing test
run-name: Agent Bus plumbing test · approval required · ${{ github.sha }}
on:
  push:
    branches: [main]
    paths: ['.github/workflows/agent-bus-plumbing.yml', 'tools/agent-bus/plumbing.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-bus-plumbing-test
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && github.triggering_actor == 'mmsanders'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/agent-bus/plumbing.py preflight
        env:
          GH_TOKEN: ${{ github.token }}
  exercise:
    needs: preflight
    environment: michael-round-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    concurrency:
      group: agent-bus-ledger-writer
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/agent-bus -p 'test_*.py' -v
      - run: python3 tools/agent-bus/plumbing.py exercise
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check every live transcript snapshot against dashboard model
        run: |
          node <<'JS'
          const fs = require('fs');
          const {build} = require('./dashboard/model.js');
          const files = fs.readdirSync('build/plumbing').filter(x => /^\d+-.*\.json$/.test(x));
          if (!files.length) throw Error('No live transcript snapshots');
          for (const file of files) {
            const result = build(JSON.parse(fs.readFileSync('build/plumbing/'+file)));
            if (result.cards.length !== 8) throw Error('Incomplete role catalog');
          }
          console.log('PASS dashboard model rendered '+files.length+' live snapshots');
          JS
      - run: node --test tools/agent-bus/test_dashboard.cjs
      - run: python3 tools/agent-bus/browser_smoke.py
      - name: Recover any remaining test resources
        if: always()
        run: python3 tools/agent-bus/plumbing.py cleanup
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plumbing-evidence-${{ github.run_id }}
          path: |
            build/plumbing/
            build/agent-bus-browser/
