name: evidence integrity

# The mechanical half of PM authentication, moved off PM's hands.
#
# STATUS recorded twenty "PM authenticated / PM reproduced the full suite"
# events. Every tranche was executed three times -- lead, PM, Verification.
# These checks are exactly the mechanical ones PM performed by hand. They are
# not judgment: PM still reads the evidence and rules on substance.
#
# A green run here is NOT a disposition, NOT package acceptance and NOT
# independent review. Those remain separate facts (CLAUDE.md §3.4).
#
# .github/CODEOWNERS makes this file and tests/*_draft8/** Michael-owned, so a
# lead cannot weaken the gate that checks its own work.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  evidence-integrity:
    name: evidence integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: cc --version | head -1; python3 --version
      - name: Build engine (package self-tests link against it)
        run: make -C engine all
      - name: Fetch retained raw evidence
        # Raw observations over 1 MiB live in a release asset, not the tree
        # (CLAUDE.md §4). This brings them back and verifies each against its
        # committed .sha256 before the replay check reads them.
        run: ./tools/fetch-evidence.sh
      - name: Evidence integrity
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE" ] && git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            python3 tools/ci/audit-evidence-integrity.py "$BASE"
          else
            python3 tools/ci/audit-evidence-integrity.py
          fi

  evidence-gate-can-go-red:
    name: evidence gate can go red
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: make -C engine all
      - name: Fetch retained raw evidence
        # This job has its OWN checkout. The control's baseline asserts that the
        # real manifest is green, which needs the real evidence, so this job
        # needs the fetch exactly as much as the gate job does. Omitting it here
        # is what broke run 8: five red-detection probes passed and both green
        # baselines failed, because the bytes were simply absent.
        run: ./tools/fetch-evidence.sh
      - name: negative control
        run: python3 tools/ci/verify-evidence-integrity-gate.py
      - name: Structural Rule 1 ordering can go red
        run: python3 tools/ci/verify-structural-rule-1.py
