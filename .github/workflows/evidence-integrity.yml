name: evidence integrity

# The mechanical half of PM authentication, moved off PM's hands.
#
# STATUS recorded twenty "PM authenticated / PM reproduced the full suite"
# events. Every tranche was executed three times -- lead, PM, Verification.
# These checks are exactly the mechanical ones PM performed by hand. They are
# not judgment: PM still reads the evidence and rules on substance.
#
# A green run here is NOT a disposition, NOT package acceptance and NOT
# independent review. Those remain separate facts (CLAUDE.md §3.4).
#
# .github/CODEOWNERS makes this file and every package tree declared in
# tests/IMPORTS.json Michael-owned, so a
# lead cannot weaken the gate that checks its own work.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  evidence-integrity:
    name: evidence integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: cc --version | head -1; python3 --version
      - name: Build engine (package self-tests link against it)
        run: make -C engine all
      - name: Package self-test requirements
        # tests/wp16_ingest_stage1 (Verification #169) self-tests need its pinned
        # numpy/scipy; every other package self-test is standard library only.
        run: python3 -m pip install --user --break-system-packages -r tests/wp16_ingest_stage1/requirements.txt
      - name: Fetch retained raw evidence
        # Raw observations over 1 MiB live in a release asset, not the tree
        # (CLAUDE.md §4). This brings them back and verifies each against its
        # committed .sha256 before the replay check reads them.
        run: ./tools/fetch-evidence.sh
      - name: Verifier main (independent repository, for the ADR-206 ordering route)
        uses: actions/checkout@v4
        with:
          repository: mmsanders/Digital-Tape-Verification
          ref: main
          path: verification-repo
          fetch-depth: 0
      - name: Evidence integrity
        run: |
          # Rule 1's review-regression route authenticates against this checkout
          # of Verification main, never a Product-chosen ref.
          export VERIFICATION_REPO="$PWD/verification-repo"
          export VERIFICATION_MAIN="$(git -C verification-repo rev-parse HEAD)"
          echo "verifier main $VERIFICATION_MAIN"
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE" ] && git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            python3 tools/ci/audit-evidence-integrity.py "$BASE"
          else
            python3 tools/ci/audit-evidence-integrity.py
          fi
      - name: Product evidence pins
        # V-R54-01 (#337): every retained Product bundle under
        # tests/*_adapter/evidence/p1-r*-product is pinned byte for byte in
        # tests/IMPORTS.json (Michael-owned), so a PR cannot change engine/,
        # regenerate, and reseal a bundle and its SHA256SUMS while staying green.
        run: python3 -B tools/ci/audit-product-evidence-pins.py

  evidence-gate-can-go-red:
    name: evidence gate can go red
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: make -C engine all
      - name: Fetch retained raw evidence
        # This job has its OWN checkout. The control's baseline asserts that the
        # real manifest is green, which needs the real evidence, so this job
        # needs the fetch exactly as much as the gate job does. Omitting it here
        # is what broke run 8: five red-detection probes passed and both green
        # baselines failed, because the bytes were simply absent.
        run: ./tools/fetch-evidence.sh
      - name: negative control
        run: python3 tools/ci/verify-evidence-integrity-gate.py
      - name: Product evidence pin audit can go red
        run: python3 -B tools/ci/verify-product-evidence-pins-gate.py
      - name: Structural Rule 1 ordering can go red
        run: python3 tools/ci/verify-structural-rule-1.py
      - name: Review-regression route over Verification394's 25 real histories
        # tests/review_order_r1 (imported unchanged) generates the histories and
        # drives the actual gate entry point: 3 must pass, 22 must be refused.
        run: |
          python3 -B tests/review_order_r1/run.py --gate tools/ci/review_order_gate.py \
            --out "$RUNNER_TEMP/review-order" > "$RUNNER_TEMP/review-order.json"
          python3 -c "import json,sys;d=json.load(open(sys.argv[1]));[print(('PASS ' if c['passed'] else 'FAIL ')+c['case'],c['exit']) for c in d['cases']];print('passed',d['passed']);sys.exit(0 if d['passed'] else 1)" "$RUNNER_TEMP/review-order.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-order-replay
          path: ${{ runner.temp }}/review-order/RESULT.json
          if-no-files-found: ignore
