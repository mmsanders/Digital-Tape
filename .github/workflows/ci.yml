name: engine

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Separate jobs, not one script, so each result is legible on its own. The build
# going green must not be hidden behind the golden suite going red -- a
# permanently-red pipeline stops being read, and then the first real failure
# arrives against a background of red.
jobs:
  build:
    name: build (-Werror)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: cc --version | head -1; objdump --version | head -1
      - run: ./tools/ci/build.sh

  spec:
    name: spec bundle matches VERSION.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PM Decisions 007 §1 asks for this on every PR touching spec/. It runs on
      # every PR instead, which is a superset and costs a second: a path filter
      # would only ever catch drift a PR introduced, and the failure it exists
      # to prevent was drift already sitting on main. It needs no build, so it
      # does not wait on `build`.
      - run: ./tools/ci/verify-spec-bundle.sh

  gates:
    name: guardrail gates
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C engine all
      # Guardrail 08 and 09, all decidable. See tools/README.md.
      - name: allocation (no malloc, no libc file I/O)
        run: ./tools/ci/audit-allocation.sh
      - name: indirect calls funnel through dev.h
        run: ./tools/ci/audit-indirect.sh
      - name: stack depth <= 8 KiB
        run: python3 tools/ci/audit-stack.py
      - name: memory budgets (RAM 200 KiB, .rodata 32 KiB)
        run: ./tools/ci/audit-memory.sh

  meta:
    name: gates can go red
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A gate that has never gone red is a gate nobody has tested. This plants
      # a real violation for each one and asserts it fails. See PM Decisions
      # 004 §6 and tools/ci/verify-gates.sh.
      - run: ./tools/ci/verify-gates.sh

  unit:
    name: scaffolding + verifier infrastructure
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C engine all
      - run: ./tools/ci/unit.sh

  golden:
    name: golden suite (awaiting WP-11 fixtures)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C engine all && make -C tests all
      # Red until the Verification Lead's fixtures and manifest land. That is
      # the only expected red in this pipeline; every other job above is green,
      # so a new failure anywhere else is a real signal.
      # Do not "fix" this by relaxing a gate.
      - run: ./tools/ci/run-golden.sh
