          --replay tests/wp10_closure_adapter/evidence/p1-r53-product
          --out tests/wp10_closure_adapter/evidence/replay
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Canonical run; the fresh JSONL must equal the retained evidence
        if: always()
        run: >
          python3 tests/wp10_closure_adapter/run_product.py
          --evidence tests/wp10_closure_adapter/evidence/product
          --retained tests/wp10_closure_adapter/evidence/p1-r53-product
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: The oracle rejects mutated Product evidence
        if: always()
        run: python3 -B tests/wp10_closure_adapter/negative_controls.py tests/wp10_closure_adapter/evidence/product/observations.jsonl.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-r53-wp10-closure-product-evidence
          path: |
            tests/wp10_closure_adapter/evidence/product
            tests/wp10_closure_adapter/evidence/replay
          if-no-files-found: error

  accepted-binding-regression-gate:
    name: accepted bindings regenerate on the current engine — gate can go red
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # the runners check the declared base/import against history.
          fetch-depth: 0
      - run: make -C engine clean all
      - run: |
          for d in crossrun_wp08 history_wp09 sequential_wp06 capacity_wp09; do
            make -C tests/${d}_adapter clean all
          done
      # PM #320 ruling 3: retained provenance names the accepted engine, and a fresh
      # build on the current engine/ regenerates the accepted observations
      # byte-identically. The per-binding jobs run the gate; this proves it can fail.
      - run: python3 -B tools/ci/verify-engine-regression-gate.py

  dashboard:
    name: lead-queue dashboard behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same script the Pages job runs before deploying. It ran only there,
      # which put the first signal after the merge, on the job whose failure also
      # stops the deploy. It also cross-checks the roadmap's package IDs against
      # the Phase 1 table in docs/PACKAGES/README.md, so a package added there
      # needs a matching stage on the dashboard -- a PR-time complaint, not a
      # surprise on main. No build, no network, no deps.
      - name: Test queue and roadmap behavior
        working-directory: site/lead-queue
        run: node test-dashboard.cjs

  playback-package:
    name: independent playback/golden package self-checks (synthetic, not engine acceptance)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deterministic fixture/candidate-PCM regeneration plus the verifier's own
      # three-family oracle, identity, exit, provenance, replay and retention
      # controls. This runs the package's SYNTHETIC stand-in adapter only: no
      # engine is built, linked or executed, so a green result is verifier
      # plumbing and never product evidence or golden acceptance.
      #
      # The candidate PCM in tests/playback_draft8/golden/ is verifier-derived
      # oracle bytes, NOT accepted WP-11 goldens: Michael's human listening is a
      # separate later step. The PRODUCT adapter lives in tests/playback_adapter
      # and cannot link yet -- no engine defines tape_seek, tape_set_rate,
      # tape_render or tape_service -- so no product playback evidence exists.
      - run: make -C tests/playback_draft8 check

  playback-complete-package:
    name: independent complete playback package self-checks (synthetic, not engine acceptance)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The P1-R6 tranche: deterministic fixture and scrub-candidate regeneration,
      # ten families, sixteen new behavioural mutations, the retained P1-R4
      # eighteen-control package, evidence identity/exit/timeout controls and
      # offline replay of the saved synthetic bundle.
      #
      # SYNTHETIC ONLY: this runs the package's own stand-in adapter. No engine is
      # built, linked or executed, so a green result is verifier plumbing -- never
      # product evidence, never listening, never WP-11 golden acceptance. The
      # candidate scrub PCM under candidate/ is verifier-derived oracle bytes.
      # The PRODUCT adapter lives in tests/playback_adapter and needs tape_status,
      # which no engine on main defines.
      - run: make -C tests/playback_complete_draft8 check

  crossrun-wp08-package:
    name: independent WP-08 R44 cross-run playback — product replay
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # run_product.py checks the declared base/import against history.
          fetch-depth: 0
      - run: python3 -B tests/crossrun_wp08_r44/selftest.py
      - run: make -C engine clean all
      - run: make -C tests/crossrun_wp08_adapter clean all
      - name: Offline replay of the committed evidence
        if: always()
        run: >
          python3 tests/crossrun_wp08_adapter/run_product.py
          --replay tests/crossrun_wp08_adapter/evidence/p1-r46-product
          --out tests/crossrun_wp08_adapter/evidence/replay
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Canonical run; the fresh JSONL and fixture must equal the committed evidence
        if: always()
        run: >
          python3 tests/crossrun_wp08_adapter/run_product.py
          --evidence tests/crossrun_wp08_adapter/evidence/product
          --retained tests/crossrun_wp08_adapter/evidence/p1-r46-product
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: The oracle rejects mutated Product evidence
        if: always()
        run: python3 -B tests/crossrun_wp08_adapter/negative_controls.py tests/crossrun_wp08_adapter/evidence/product/observations.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-r46-wp08-crossrun-product-evidence
          path: |
            tests/crossrun_wp08_adapter/evidence/product
            tests/crossrun_wp08_adapter/evidence/replay
          if-no-files-found: error

  build:
    name: build (-Werror)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: cc --version | head -1; objdump --version | head -1
      - run: ./tools/ci/build.sh

  history-wp09-package:
    name: independent WP-09 R44 seeded record history — product replay
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # run_product.py checks the declared base/import against history.
          fetch-depth: 0
      - run: python3 -B tests/history_wp09_r44/selftest.py
      - run: make -C engine clean all
      - run: make -C tests/history_wp09_adapter clean all
      - name: Offline replay of the committed evidence
        if: always()
        run: >
          python3 tests/history_wp09_adapter/run_product.py
          --replay tests/history_wp09_adapter/evidence/p1-r46-product
          --out tests/history_wp09_adapter/evidence/replay
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Canonical run; the fresh JSONL must equal the committed evidence
        if: always()
        run: >
          python3 tests/history_wp09_adapter/run_product.py
          --evidence tests/history_wp09_adapter/evidence/product
          --retained tests/history_wp09_adapter/evidence/p1-r46-product
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: The oracle rejects mutated Product evidence
        if: always()
        run: python3 -B tests/history_wp09_adapter/negative_controls.py tests/history_wp09_adapter/evidence/product/observations.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-r46-wp09-history-product-evidence
          path: |
            tests/history_wp09_adapter/evidence/product
            tests/history_wp09_adapter/evidence/replay
          if-no-files-found: error

  spec:
    name: spec bundle matches VERSION.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PM Decisions 007 §1 asks for this on every PR touching spec/. It runs on
      # every PR instead, which is a superset and costs a second: a path filter
      # would only ever catch drift a PR introduced, and the failure it exists
      # to prevent was drift already sitting on main. It needs no build, so it
      # does not wait on `build`.
      - run: ./tools/ci/verify-spec-bundle.sh

  gates:
    name: guardrail gates
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C engine all
      # Guardrail 08 and 09, all decidable. See tools/README.md.
      - name: allocation (no malloc, no libc file I/O)
        run: ./tools/ci/audit-allocation.sh
      - name: indirect calls funnel through dev.h
        run: ./tools/ci/audit-indirect.sh
      - name: stack depth <= 8 KiB
        run: python3 tools/ci/audit-stack.py
      - name: memory budgets (RAM 200 KiB, .rodata 32 KiB)
        run: ./tools/ci/audit-memory.sh

  meta:
    name: gates can go red
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A gate that has never gone red is a gate nobody has tested. This plants
      # a real violation for each one and asserts it fails. See PM Decisions
      # 004 §6 and tools/ci/verify-gates.sh.
      - run: ./tools/ci/verify-gates.sh

  unit:
    name: scaffolding + verifier infrastructure
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C engine all
      - run: ./tools/ci/unit.sh

  tapectl:
    # docs/WP11-CLI-CONTRACT.md (#366): tapectl builds, its WAV reader/writer pass
    # their unit tests (48 kHz, mono, 24-bit rejected), and a format -> load ->
    # dump round trip on the real engine gives the source back byte for byte.
    # WP-14 (#385, docs/WP14-CLI-CONTRACT.md) adds the host-port unit tests, the
    # provisioned-image smoke (fsck.fat and mtools read partition 1), every §5
    # refusal through the TAPECTL_TEST seam, and the seam-absence check.
    name: tapectl — build, unit tests, WP-11 and WP-14 image smoke (Linux)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: OS build and FAT checkers
        run: |
          uname -a; . /etc/os-release && echo "$PRETTY_NAME"; cc --version | head -1
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends dosfstools mtools
      - run: tools/ci/annotate-tail.sh "Linux host tests" make -C host test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp14-traces-linux-image
          path: build/host/trace/traces
          if-no-files-found: ignore

  wp14-linux-device:
    # WP-14 on a real Linux block device: a loop device over a 64 GiB sparse file
    # (A6: the mirror superblock sits past 4 GiB). The shipped tapectl must refuse
    # it (a loop device is not a §2 Linux form, #384 Q2); the round trip
    # provision -> load -> detach/reattach -> verify -> dump runs through
    # tapectl-test with injected facts. Then the real probe on the runner's own
    # root disk must report holds_os.
    name: WP-14 device round trip — Linux loop device
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: OS build
        run: uname -a; . /etc/os-release && echo "$PRETTY_NAME"
      - run: make -C host
      - name: Loop-device round trip
        run: |
          truncate -s 64G "$RUNNER_TEMP/card.img"
          sudo -E tools/ci/annotate-tail.sh "loop round trip" host/device_e2e.sh build/host/tapectl build/host/tapectl-test "$RUNNER_TEMP/e2e" host/loop_linux.sh "$RUNNER_TEMP/card.img"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp14-traces-linux-loop
          path: ${{ runner.temp }}/e2e/traces
          if-no-files-found: ignore
      - name: The real probe on this runner's root disk
        run: |
          root=$(lsblk -no PKNAME "$(findmnt -no SOURCE /)" | head -1)
          sudo build/host/tapectl-test probe "/dev/$root" | tee probe.txt
          grep -q '^holds_os=1' probe.txt
          ! grep -q '^refusal=REFUSE_NONE' probe.txt
          rc=0; sudo build/host/tapectl verify "/dev/$root" || rc=$?
          test "$rc" -eq 3

  wp14-macos:
    # WP-14 on macOS (D2): build with the system clang (the engine archive with
    # GCC, whose stack-analysis flags the engine Makefile uses), the full host
    # test suite, then a round trip on a real /dev/diskN: a 64 GiB sparse raw
    # image attached by hdiutil. Raw I/O goes through /dev/rdiskN and the
    # durable flush is reported (#384 Q6). On reattach macOS mounts partition 1
    # itself, so the probe's own-partition-1 exception and README.TXT are real.
    name: WP-14 tapectl — macOS build, image smoke, disk-image round trip
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: OS build
        run: sw_vers; uname -a; clang --version | head -1
      - name: Engine archive (GCC)
        run: |
          GCC=$(ls /opt/homebrew/bin/gcc-[0-9]* /usr/local/bin/gcc-[0-9]* 2>/dev/null | grep -E 'gcc-[0-9]+$' | sort -V | tail -1)
          test -n "$GCC" && $GCC --version | head -1
          make -C engine CC="$GCC" all
      - run: tools/ci/annotate-tail.sh "macOS host tests" make -C host CC=clang test
      - name: Disk-image round trip
        run: |
          mkfile -n 64g "$RUNNER_TEMP/card.raw"
          sudo -E tools/ci/annotate-tail.sh "macOS disk-image round trip" host/device_e2e.sh build/host/tapectl build/host/tapectl-test "$RUNNER_TEMP/e2e" host/hdiutil_macos.sh "$RUNNER_TEMP/card.raw"
          cat /Volumes/DIGITALTAPE/README.TXT 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp14-traces-macos
          path: |
            ${{ runner.temp }}/e2e/traces
            build/host/trace/traces
          if-no-files-found: ignore

  wp14-windows:
    # WP-14 on Windows (D2): MinGW-w64 build, the full host test suite in Git
    # Bash, then a round trip on a real \\.\PhysicalDriveN: an 8 GiB expandable
    # VHD attached by diskpart. On reattach Windows mounts partition 1 and gives
    # it a drive letter, so README.TXT and the own-partition-1 exception are real.
    name: WP-14 tapectl — Windows build, image smoke, VHD round trip
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: OS build and toolchain
        run: |
          cmd //c ver; powershell -NoProfile -Command "(Get-CimInstance Win32_OperatingSystem).Caption + ' ' + (Get-CimInstance Win32_OperatingSystem).BuildNumber"
          export PATH="/c/mingw64/bin:$PATH"
          which -a gcc mingw32-make make 2>/dev/null || true; gcc --version | head -1
      - name: Engine and tapectl
        run: |
          export PATH="/c/mingw64/bin:$PATH"
          MAKE=$(command -v mingw32-make || command -v make)
          tools/ci/annotate-tail.sh "Windows engine build" "$MAKE" -C engine CC=gcc all
          tools/ci/annotate-tail.sh "Windows host build" "$MAKE" -C host CC=gcc test-bins
          # The tests run from bash: mingw32-make would hand them to cmd.exe.
          tools/ci/annotate-tail.sh "Windows host tests" host/run_tests.sh ../build/host .exe
      - name: VHD round trip
        run: |
          export PATH="/c/mingw64/bin:$PATH"
          tools/ci/annotate-tail.sh "Windows VHD round trip" host/device_e2e.sh build/host/tapectl.exe build/host/tapectl-test.exe "$RUNNER_TEMP/e2e" host/vhd_windows.sh "$RUNNER_TEMP/card.vhd"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp14-traces-windows
          path: |
            ${{ runner.temp }}/e2e/traces
            build/host/trace/traces
          if-no-files-found: ignore

  wp14-package:
    # Verification's WP-14 package (tests/wp14_r1, #146; imported byte-identically
    # under tests/IMPORTS.json) run against this head on each named OS:
    #   image   runner.py on the shipped tapectl: 79 image cases + 11 controls;
    #   native  native.py through Software's transport (tests/wp14_adapter):
    #           owned virtual devices only (Linux loop, macOS raw disk image,
    #           Windows VHD), tapectl-test traces and iocap capture of the
    #           shipped binary. No physical disk is touched.
    # The package owns every expectation and verdict; this job only runs it and
    # keeps the raw evidence. Files over 256 MiB are zstd-compressed in the
    # artifact; their SHA-256 is in each capture's large-artifacts.json.
    # Windows here is Server 2025: supplemental, never Windows 10 acceptance.
    name: WP-14 package (${{ matrix.platform }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && (needs.changes.outputs.qualify != 'false' || contains(needs.changes.outputs.qualify_jobs, ',wp14-package,')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: macos
            runner: macos-latest
          - platform: windows
            runner: windows-latest
    defaults:
      run:
        shell: bash
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build tapectl, tapectl-test and the capture shim
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            linux)
              uname -a; . /etc/os-release && echo "$PRETTY_NAME"; cc --version | head -1
              make -C host
              cc -shared -fPIC -O2 -Wall -o build/host/iocap.so tests/wp14_adapter/iocap_posix.c -ldl
              PY=python3 ;;
            macos)
              sw_vers; uname -a; clang --version | head -1
              GCC=$(ls /opt/homebrew/bin/gcc-[0-9]* /usr/local/bin/gcc-[0-9]* 2>/dev/null | grep -E 'gcc-[0-9]+$' | sort -V | tail -1)
              make -C engine CC="$GCC" all
              make -C host CC=clang
              clang -dynamiclib -O2 -Wall -o build/host/iocap.dylib tests/wp14_adapter/iocap_posix.c
              PY=python3 ;;
            windows)
              export PATH="/c/mingw64/bin:$PATH"
              cmd //c ver; gcc --version | head -1
              MAKE=$(command -v mingw32-make || command -v make)
              "$MAKE" -C engine CC=gcc all
              "$MAKE" -C host CC=gcc test-bins
              gcc -O2 -Wall -DIOCAP_DLL -shared -o build/host/iocap.dll tests/wp14_adapter/iocap_win.c
              gcc -O2 -Wall -municode -o build/host/iocap.exe tests/wp14_adapter/iocap_win.c
              echo "/c/mingw64/bin" >> "$GITHUB_PATH"
              PY=python ;;
          esac
          echo "PY=$(command -v $PY)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/wp14-out"
          "$PY" - "$RUNNER_TEMP/wp14-out/build-info-$PLATFORM.json" <<'PYEOF'
          import hashlib, json, os, platform, sys
          b = 'build/host'
          info = {'head_sha': os.environ['HEAD_SHA'], 'platform': os.environ['PLATFORM'],
                  'run': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}",
                  'runner_os': os.environ.get('ImageOS', ''), 'runner_image': os.environ.get('ImageVersion', ''),
                  'machine': platform.platform(), 'binaries': {}}
          for f in sorted(os.listdir(b)):
              p = os.path.join(b, f)
              if os.path.isfile(p) and (f.startswith(('tapectl', 'iocap'))):
                  info['binaries'][f] = hashlib.sha256(open(p, 'rb').read()).hexdigest()
          open(sys.argv[1], 'w').write(json.dumps(info, indent=1) + '\n')
          print(json.dumps(info, indent=1))
          PYEOF
      - name: Windows — no automatic drive letters for attached test VHDs
        if: matrix.platform == 'windows'
        run: powershell -NoProfile -Command "mountvol /N"
      - name: Image cases (runner.py, shipped tapectl)
        id: image
        continue-on-error: true
        run: |
          set -uo pipefail
          root=$(pwd); [ "$PLATFORM" = windows ] && root=$(cygpath -m "$root")
          exe=; [ "$PLATFORM" = windows ] && exe=.exe
          export TMPDIR="$RUNNER_TEMP" TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP"
          "$PY" -B tests/wp14_r1/runner.py "$root/build/host/tapectl$exe" --head "$HEAD_SHA" \
            > "$RUNNER_TEMP/wp14-out/image-$PLATFORM.json" 2> >(tee "$RUNNER_TEMP/wp14-out/image-$PLATFORM.stderr" >&2)
      - name: Native cases (native.py through tests/wp14_adapter/transport.py)
        id: native
        continue-on-error: true
        run: |
          set -uo pipefail
          root=$(pwd); ev="$RUNNER_TEMP/wp14-evidence"; out="$RUNNER_TEMP/wp14-out"
          if [ "$PLATFORM" = windows ]; then
            root=$(cygpath -m "$root"); ev=$(cygpath -m "$ev"); SUDO=
          else
            SUDO="sudo -E env PATH=$PATH"
          fi
          export TMPDIR="$RUNNER_TEMP" TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP" WP14_BUILD_INFO="$out/build-info-$PLATFORM.json"
          $SUDO "$PY" -B tests/wp14_r1/native.py --platform "$PLATFORM" --head "$HEAD_SHA" --evidence-dir "$ev" \
            -- "$PY" -B "$root/tests/wp14_adapter/transport.py" --build "$root/build/host" \
            > "$out/native-$PLATFORM.json" 2> >(tee "$out/native-$PLATFORM.stderr" >&2)
      - name: Compress raw files over 256 MiB (hashes stay in large-artifacts.json)
        if: always()
        run: |
          set -uo pipefail
          [ "$PLATFORM" = windows ] || sudo chown -R "$(id -u)" "$RUNNER_TEMP/wp14-evidence" 2>/dev/null || true
          find "$RUNNER_TEMP/wp14-out" "$RUNNER_TEMP/wp14-evidence" -type f -size +256M 2>/dev/null | while read -r f; do
            echo "zstd $f"; zstd -q -T0 -3 --rm "$f" || true
          done
          find "$RUNNER_TEMP/wp14-evidence" -type d -name work -prune -exec rm -rf {} + 2>/dev/null || true
          du -sh "$RUNNER_TEMP/wp14-out" "$RUNNER_TEMP/wp14-evidence" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp14-package-${{ matrix.platform }}
          path: ${{ runner.temp }}/wp14-out
          compression-level: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp14-native-evidence-${{ matrix.platform }}
          path: ${{ runner.temp }}/wp14-evidence
          compression-level: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp14-binaries-${{ matrix.platform }}
          path: |
            build/host/tapectl
            build/host/tapectl.exe
          if-no-files-found: ignore
      - name: Verdict
        run: |
          echo "image: ${{ steps.image.outcome }}  native: ${{ steps.native.outcome }}"
          test "${{ steps.image.outcome }}" = success && test "${{ steps.native.outcome }}" = success

  wp14-package-census:
    # The package's own closed census over all six JSONs (qualification.py) and
    # its Git-object identity audit (a8_identity.py) against the publication on
    # Verification main. Neither is acceptance: Verification disposes.
    name: WP-14 package — closed census and Git identity
    needs: wp14-package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: mmsanders/Digital-Tape-Verification
          path: verification-repo
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: wp14-package-*
          path: ${{ runner.temp }}/bundle
          merge-multiple: true
      - name: Closed census (tests/wp14_r1/qualification.py)
        run: |
          set -euo pipefail
          b="$RUNNER_TEMP/bundle"
          for z in "$b"/*.zst; do [ -e "$z" ] && zstd -q -d --rm "$z"; done
          ls -la "$b"
          python3 -B tests/wp14_r1/qualification.py --head "$HEAD_SHA" "$b" | tee "$RUNNER_TEMP/census.json"
      - name: Git identity (tests/wp14_r1/a8_identity.py)
        run: |
          set -euo pipefail
          # The import commit is the last commit that touched the imported tree
          # (binding commits never do); the publication is its declared source.
          imp=$(git log --format=%H -1 -- tests/wp14_r1)
          pub=$(python3 -c "import json;print(next(p['source_commit'] for p in json.load(open('tests/IMPORTS.json'))['packages'] if p['path']=='tests/wp14_r1'))")
          echo "import commit $imp, publication $pub, candidate $HEAD_SHA"
          python3 -B tests/wp14_r1/a8_identity.py --verification verification-repo --product . \
            --publication "$pub" --candidate "$HEAD_SHA" --import-commit "$imp" \
            --import-path tests/wp14_r1 --golden-path tests/golden | tee "$RUNNER_TEMP/a8-identity.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp14-census
          path: |
            ${{ runner.temp }}/census.json
            ${{ runner.temp }}/a8-identity.json
          if-no-files-found: ignore

  wp11-portability:
    # acceptance WP-11 portability gate (#366). (a) host GCC; (b) the embedded
    # target, arm-none-eabi-gcc Cortex-M3 under qemu-arm; (c) the static-assert
    # alternative, because the engine cannot be built for a 16-bit target.
    # Each runs Verification #143's differential (tests/wp11_portability_r63,
    # 11,572,876 comparisons) against tape_test_interp.
    name: WP-11 portability (${{ matrix.config }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [host-gcc, arm-m3, narrow-int]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Embedded toolchain and emulator
        if: matrix.config == 'arm-m3'
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-user
      - run: clang --version | head -1
      - run: tools/ci/wp11-portability.sh ${{ matrix.config }}

  wp11-mutation-gate:
    # acceptance WP-11 mutation testing (#366): each of the seven mutations, as a
    # patch to engine/, must turn a verifier suite red. The negative control runs
    # first and proves the gate fails when a (benign) mutation survives.
    name: WP-11 mutation gate — seven mutations, each caught
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && (needs.changes.outputs.qualify != 'false' || contains(needs.changes.outputs.qualify_jobs, ',wp11-mutation-gate,')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # the product runners check declared imports against history.
          fetch-depth: 0
      - name: PyYAML (the gate reads each suite's steps from this workflow)
        run: python3 -c "import yaml" 2>/dev/null || (sudo apt-get update -q && sudo apt-get install -y --no-install-recommends python3-yaml)
      - run: tools/ci/verify-fetch-evidence-wp11.sh
      - run: tools/ci/mutation-gate --control
      - run: tools/ci/mutation-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp11-mutation-gate-logs
          path: build/mutation-gate
          if-no-files-found: ignore

  golden:
    # WP-11 (#366 Stage 2): Verification #143's ten independent references,
    # run through tapectl by tests/golden/MANIFEST and compared byte for byte.
    # A failure writes an audible-difference WAV; it is never fixed by touching
    # a reference or fitting the engine. Do not "fix" this by relaxing a gate.
    name: golden suite — WP-11 R63 references, byte-exact
    needs: [changes, build]
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C engine all && make -C host && make -C tests all
      - name: Reference package integrity (SHA256SUMS)
        run: cd tests/golden && sha256sum -c SHA256SUMS
      - run: ./tools/ci/run-golden.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-diff
          path: build/tests/golden
          if-no-files-found: ignore

  wp11-release-assets:
    # The archival source originals and canonical WAVs #143 publishes as release
    # assets, fetched and refused unless they hash to SOURCES.json's values. Kept
    # out of the golden job so the mutation gate's golden suite never touches the
    # network.
    name: WP-11 fixture release assets — fetched and sha256-verified
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: tools/fetch-evidence.sh wp11

  # ---------------------------------------------------------------------------
  # Lane aggregates (R1, #385). These three check names, plus the
  # evidence-integrity and repo-hygiene contexts, are what ruleset 22084355
  # requires. Each aggregate's `needs:` IS its lane: tools/ci/ci_lanes.py reads
  # lane membership from here, and verify-change-classifier.py fails if any
  # job is in no lane or in two. The verdict passes only when every selected
  # member succeeded and every unselected member was skipped.
  cheap:
    name: cheap
    needs:
      - changes
      - spec
      - build
      - gates
      - meta
      - unit
      - dashboard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B tools/ci/lane-verdict.py
        env:
          LANE: cheap
          NEEDS: ${{ toJSON(needs) }}

  regression:
    name: regression
    needs:
      - changes
      - verifier-package
      - ops-package
      - record-package
      - transport-package
      - respool-package
      - format-dup-package
      - writability-package
      - notmounted-package
      - slot-package
      - embedded-readiness-package
      - sequential-wp06-package
      - capacity-wp09-package
      - wp12-closure-package
      - portability-wp08-package
      - wp06-closure-package
      - strengthen-r55-package
      - wp08-mapping-r56-package
      - wp09-gaps-r56-package
      - wp10-closure-package
      - accepted-binding-regression-gate
      - playback-package
      - playback-complete-package
      - crossrun-wp08-package
      - history-wp09-package
      - tapectl
      - wp14-linux-device
      - wp14-macos
      - wp14-windows
      - wp11-portability
      - golden
      - wp11-release-assets
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B tools/ci/lane-verdict.py
        env:
          LANE: regression
          NEEDS: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          QUALIFY: ${{ needs.changes.outputs.qualify }}
          QUALIFY_JOBS: ${{ needs.changes.outputs.qualify_jobs }}

  qualification:
    name: qualification
    needs:
      - changes
      - allocator-cow-package
      - wp36-fuzz-package
      - format-dup-identity-package
      - promote-package
      - crash-core-package
      - wp10-final-package
      - wp10-backlog-package
      - wp10-backlog-r54-package
      - wp10-residue-package
      - respool-full-functional
      - respool-full-crash
      - respool-full-aggregate
      - wp11-mutation-gate
      - wp14-package
      - wp14-package-census
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B tools/ci/lane-verdict.py
        env:
          LANE: qualification
          NEEDS: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          QUALIFY: ${{ needs.changes.outputs.qualify }}
          QUALIFY_JOBS: ${{ needs.changes.outputs.qualify_jobs }}
