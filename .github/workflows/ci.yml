name: engine

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Separate jobs, not one script, so each result is legible on its own. The build
# going green must not be hidden behind the golden suite going red -- a
# permanently-red pipeline stops being read, and then the first real failure
# arrives against a background of red.
jobs:
  verifier-package:
    name: independent DRAFT-8 mount package self-checks (not engine acceptance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C tests/mount_draft8 check

  ops-package:
    name: independent VT8-001 package self-checks (synthetic, not engine acceptance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The verifier's own negative controls over its oracle, evidence capture,
      # DRAFT-8 spec authentication and offline replay -- including the
      # missing-evidence and tampered-evidence cases. It runs the package's
      # SYNTHETIC stand-in adapter: no engine is built, linked or executed here,
      # so a green result is plumbing evidence and never product acceptance.
      # The product adapter lives in tests/ops_adapter and cannot link until an
      # engine defines the six missing public operations.
      - run: python3 tests/ops_draft8/selftest.py

  record-package:
    name: independent WP-09 record package — synthetic self-checks, then product observations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Two separable facts, in order, in one job.
      #
      # 1. The verifier's own negative controls over its record oracles, run
      #    against the package's SYNTHETIC stand-in adapter. No engine is built,
      #    linked or executed here, so a green result is verifier plumbing and
      #    never product evidence.
      - run: python3 tests/record_draft8/selftest.py
      # 2. The PRODUCT observation. The real engine is linked into the
      #    mechanical adapter in tests/record_adapter, driven through every
      #    published case, and judged by the package's own check functions,
      #    imported unmodified. A green result is a raw observation for blind
      #    Verification disposition — never acceptance, never a listened golden,
      #    and it observes no PCM at all: the VO08 envelope carries no chunk data.
      #
      #    Verification PR #39 corrected the ARMED-BUSY verifier contradiction;
      #    this is now an ordinary all-cases product run with no exception.
      - run: make -C engine all
      - run: make -C tests/record_adapter all
      - run: python3 tests/record_adapter/run_product.py --evidence tests/record_adapter/evidence/p1-r25-product


  transport-package:
    name: independent transport/warm package — synthetic self-checks, then product observations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/transport_draft8/selftest.py
      - run: make -C engine all
      - run: make -C tests/transport_adapter all
      - run: python3 tests/transport_adapter/run_product.py --evidence tests/transport_adapter/evidence/p1-r25-product
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-r25-transport-product-evidence
          path: tests/transport_adapter/evidence/p1-r25-product
          if-no-files-found: error

  promote-package:
    name: independent promote package — synthetic self-checks, then product observations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # First prove the independently published verifier plumbing against its
      # synthetic adapter; then bind the exact same package to the real engine.
      - run: python3 tests/promote_draft8/selftest.py
      - run: make -C engine all
      - run: make -C tests/promote_adapter all
      - name: Prove rejected callbacks remain observable
        run: tests/promote_adapter/build/wp_promote_probe --selfcheck-callback-trace
      - run: python3 tests/promote_adapter/run_product.py --evidence tests/promote_adapter/evidence/p1-r25-product
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-r25-promote-product-evidence
          path: tests/promote_adapter/evidence/p1-r25-product
          if-no-files-found: error

  respool-package:
    name: independent respool package — synthetic self-checks, then full 8-case product observations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/respool_draft8/selftest.py
      - run: make -C engine all
      - run: make -C tests/respool_adapter all
      - run: python3 tests/respool_adapter/run_product.py --evidence tests/respool_adapter/evidence/p1-r25-product
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-r25-respool-product-evidence
          path: tests/respool_adapter/evidence/p1-r25-product
          if-no-files-found: error

  format-dup-package:
    name: independent format/dup package — synthetic self-checks, then product observations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/format_dup_draft8/selftest.py
      - run: make -C engine all
      - run: make -C tests/format_dup_adapter all
      - name: Prove rejected raw-operation callbacks remain observable
        run: tests/format_dup_adapter/build/wp_fmt_dup_probe --selfcheck-callback-trace
      - run: python3 tests/format_dup_adapter/run_product.py --evidence tests/format_dup_adapter/evidence/p1-r25-product
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-r25-format-dup-product-evidence
          path: tests/format_dup_adapter/evidence/p1-r25-product
          if-no-files-found: error

  writability-package:
    name: independent writability package — synthetic self-checks, then 8-case product observations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/writability_draft8/selftest.py
      - run: make -C engine all
      - run: make -C tests/writability_adapter all
      - run: python3 tests/writability_adapter/run_product.py --evidence tests/writability_adapter/evidence/p1-r25-product
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-r25-writability-product-evidence
          path: tests/writability_adapter/evidence/p1-r25-product
          if-no-files-found: error

  notmounted-package:
    name: independent not-mounted package — synthetic self-checks, then 34-case product observations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/notmounted_draft8/selftest.py
      - run: make -C engine all
      - run: make -C tests/notmounted_adapter all
      - run: python3 tests/notmounted_adapter/run_product.py --evidence tests/notmounted_adapter/evidence/p1-r25-product
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-r25-notmounted-product-evidence
          path: tests/notmounted_adapter/evidence/p1-r25-product
          if-no-files-found: error


  slot-package:
    name: independent WP-36 slot package — synthetic self-checks, then debug-assert product observations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/slot_draft8/selftest.py
      - name: Build engine with debug dev_write assertion enabled
        run: |
          make -C engine clean
          make -C engine all CFLAGS=-UNDEBUG
      - run: make -C tests/slot_adapter all
      - run: python3 tests/slot_adapter/run_product.py --evidence tests/slot_adapter/evidence/p1-r25-product
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-r25-slot-product-evidence
          path: tests/slot_adapter/evidence/p1-r25-product
          if-no-files-found: error

  wp36-fuzz-package:
    name: independent WP-36 100k source-slot fuzz — debug real-product observations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/wp36_fuzz_draft8/selftest.py
      - name: Build engine with debug dev_write assertion enabled
        run: |
          make -C engine clean
          make -C engine all CFLAGS=-UNDEBUG
      - run: make -C tests/wp36_fuzz_adapter all
      - run: python3 tests/wp36_fuzz_adapter/run_product.py --evidence tests/wp36_fuzz_adapter/evidence/p1-r26-product
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-r26-wp36-100k-product-evidence
          path: tests/wp36_fuzz_adapter/evidence/p1-r26-product
          if-no-files-found: error

  embedded-readiness-package:
    name: independent WP-13 embedded-readiness audit — six-gate real-product evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: python3 tests/embedded_readiness_draft8/selftest.py
      - run: python3 -m py_compile tests/embedded_readiness_adapter/collect_product_evidence.py
      - run: python3 tests/embedded_readiness_adapter/collect_product_evidence.py --evidence tests/embedded_readiness_adapter/evidence/p1-r27-product
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-r27-wp13-embedded-readiness-evidence
          path: tests/embedded_readiness_adapter/evidence/p1-r27-product
          if-no-files-found: error

  allocator-cow-package:
    name: independent WP-07 allocator/COW — fixed 10k real-product campaign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: python3 tests/allocator_cow_draft8/selftest.py
      - run: make -C engine clean all
      - name: Build product adapter and retain command log
        run: |
          set -o pipefail
          make -C tests/allocator_cow_adapter clean all 2>&1 | tee tests/allocator_cow_adapter/build.log
      - run: python3 tests/allocator_cow_adapter/run_product.py --evidence tests/allocator_cow_adapter/evidence/p1-r27-product
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-r27-wp07-allocator-cow-evidence
          path: tests/allocator_cow_adapter/evidence/p1-r27-product
          if-no-files-found: error

  crash-core-package:
    name: independent WP-10 core crash — bounded real-product campaign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: python3 tests/crash_core_draft8/selftest.py
      - run: make -C engine clean all
      - name: Build product crash adapter and retain command log
        run: |
          set -o pipefail
          make -C tests/crash_core_adapter clean all 2>&1 | tee tests/crash_core_adapter/build.log
      - name: Run fixed bounded WP-10 core crash campaign
        run: python3 tests/crash_core_adapter/run_product.py --evidence tests/crash_core_adapter/evidence/p1-r27-product
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-r27-wp10-core-crash-evidence
          path: tests/crash_core_adapter/evidence/p1-r27-product
          if-no-files-found: error

  dashboard:
    name: lead-queue dashboard behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same script the Pages job runs before deploying. It ran only there,
      # which put the first signal after the merge, on the job whose failure also
      # stops the deploy. It also cross-checks the roadmap's package IDs against
      # the Phase 1 table in docs/PACKAGES/README.md, so a package added there
      # needs a matching stage on the dashboard -- a PR-time complaint, not a
      # surprise on main. No build, no network, no deps.
      - name: Test queue and roadmap behavior
        working-directory: site/lead-queue
        run: node test-dashboard.cjs

  playback-package:
    name: independent playback/golden package self-checks (synthetic, not engine acceptance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deterministic fixture/candidate-PCM regeneration plus the verifier's own
      # three-family oracle, identity, exit, provenance, replay and retention
      # controls. This runs the package's SYNTHETIC stand-in adapter only: no
      # engine is built, linked or executed, so a green result is verifier
      # plumbing and never product evidence or golden acceptance.
      #
      # The candidate PCM in tests/playback_draft8/golden/ is verifier-derived
      # oracle bytes, NOT accepted WP-11 goldens: Michael's human listening is a
      # separate later step. The PRODUCT adapter lives in tests/playback_adapter
      # and cannot link yet -- no engine defines tape_seek, tape_set_rate,
      # tape_render or tape_service -- so no product playback evidence exists.
      - run: make -C tests/playback_draft8 check

  playback-complete-package:
    name: independent complete playback package self-checks (synthetic, not engine acceptance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The P1-R6 tranche: deterministic fixture and scrub-candidate regeneration,
      # ten families, sixteen new behavioural mutations, the retained P1-R4
      # eighteen-control package, evidence identity/exit/timeout controls and
      # offline replay of the saved synthetic bundle.
      #
      # SYNTHETIC ONLY: this runs the package's own stand-in adapter. No engine is
      # built, linked or executed, so a green result is verifier plumbing -- never
      # product evidence, never listening, never WP-11 golden acceptance. The
      # candidate scrub PCM under candidate/ is verifier-derived oracle bytes.
      # The PRODUCT adapter lives in tests/playback_adapter and needs tape_status,
      # which no engine on main defines.
      - run: make -C tests/playback_complete_draft8 check

  build:
    name: build (-Werror)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: cc --version | head -1; objdump --version | head -1
      - run: ./tools/ci/build.sh

  spec:
    name: spec bundle matches VERSION.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PM Decisions 007 §1 asks for this on every PR touching spec/. It runs on
      # every PR instead, which is a superset and costs a second: a path filter
      # would only ever catch drift a PR introduced, and the failure it exists
      # to prevent was drift already sitting on main. It needs no build, so it
      # does not wait on `build`.
      - run: ./tools/ci/verify-spec-bundle.sh

  gates:
    name: guardrail gates
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C engine all
      # Guardrail 08 and 09, all decidable. See tools/README.md.
      - name: allocation (no malloc, no libc file I/O)
        run: ./tools/ci/audit-allocation.sh
      - name: indirect calls funnel through dev.h
        run: ./tools/ci/audit-indirect.sh
      - name: stack depth <= 8 KiB
        run: python3 tools/ci/audit-stack.py
      - name: memory budgets (RAM 200 KiB, .rodata 32 KiB)
        run: ./tools/ci/audit-memory.sh

  meta:
    name: gates can go red
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A gate that has never gone red is a gate nobody has tested. This plants
      # a real violation for each one and asserts it fails. See PM Decisions
      # 004 §6 and tools/ci/verify-gates.sh.
      - run: ./tools/ci/verify-gates.sh

  unit:
    name: scaffolding + verifier infrastructure
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C engine all
      - run: ./tools/ci/unit.sh

  golden:
    name: golden suite (awaiting WP-11 fixtures)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C engine all && make -C tests all
      # Red until the Verification Lead's fixtures and manifest land. That is
      # the only expected red in this pipeline; every other job above is green,
      # so a new failure anywhere else is a real signal.
      # Do not "fix" this by relaxing a gate.
      - run: ./tools/ci/run-golden.sh
