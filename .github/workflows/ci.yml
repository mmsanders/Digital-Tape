name: engine

on:
  # main pushes only: a PR branch push is covered by its pull_request run, and
  # running both doubled every PR's cost (#347). Cite the pull_request run, or
  # a workflow_dispatch run on the exact head SHA (docs/ISSUE-WORKFLOW.md).
  push:
    branches: [main]
  pull_request:
    # `labeled` so adding the `qualification` label (phase gates) starts a
    # run that includes the qualification lane.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  # The qualification lane's standing run (R1, #385): full campaigns, the
  # mutation gate and the WP-10 backlogs, daily on main.
  schedule:
    - cron: '17 9 * * *'

# A newer push to the same PR cancels the superseded run. Every other run (main
# pushes, dispatches) gets a group of its own run id, so main runs never cancel
# or queue behind each other and every main commit keeps its complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Separate jobs, not one script, so each result is legible on its own. The build
# going green must not be hidden behind the golden suite going red -- a
# permanently-red pipeline stops being read, and then the first real failure
# arrives against a background of red.
jobs:
  # Three lanes (R1, #385; lane aggregates at the end of this file):
  #   cheap          every change, docs included;
  #   regression     every change that is not docs-only (#347);
  #   qualification  daily schedule, workflow_dispatch, a PR labelled
  #                  `qualification` (phase gates), any change that could move
  #                  an engine result, and a job whose own test dirs changed.
  # PRs and main pushes are classified the same way. The classifier fails toward
  # running more: if it fails or is unsure, docs_only is not 'true', qualify is
  # not 'false', and every lane runs. tools/ci/ci_lanes.py holds the rules and
  # tools/ci/verify-change-classifier.py their negative controls.
  changes:
    name: classify changes into lanes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      qualify: ${{ steps.classify.outputs.qualify }}
      qualify_jobs: ${{ steps.classify.outputs.qualify_jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull_request merge commit and its first parent (the base).
          fetch-depth: 2
      - name: Classifier and lane negative controls
        run: python3 -B tools/ci/verify-change-classifier.py
      - name: Classify
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          paths="$RUNNER_TEMP/changed-paths"
          : > "$paths"
          case "$EVENT" in
            pull_request)
              # HEAD is the PR merge commit; diff it against the base it merges into.
              test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3
              git diff -z --no-renames --name-only HEAD^1 HEAD > "$paths"
              ;;
            push)
              # Everything the push brought to main. An unknown or unreachable
              # base leaves the list empty, and an empty list runs every lane.
              if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
                  && git fetch --no-tags --depth=1 origin "$BEFORE"; then
                git diff -z --no-renames --name-only "$BEFORE" HEAD > "$paths"
              fi
              ;;
          esac
          python3 -B tools/ci/classify-changes.py < "$paths"

  verifier-package:
    name: independent DRAFT-8 mount package self-checks (not engine acceptance)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C tests/mount_draft8 check

  ops-package:
    name: independent VT8-001 package self-checks (synthetic, not engine acceptance)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The verifier's own negative controls over its oracle, evidence capture,
      # DRAFT-8 spec authentication and offline replay -- including the
      # missing-evidence and tampered-evidence cases. It runs the package's
      # SYNTHETIC stand-in adapter: no engine is built, linked or executed here,
      # so a green result is plumbing evidence and never product acceptance.
      # The product adapter lives in tests/ops_adapter and cannot link until an
      # engine defines the six missing public operations.
      - run: python3 tests/ops_draft8/selftest.py

  record-package:
    name: independent WP-09 record package — synthetic self-checks, then product observations
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Two separable facts, in order, in one job.
      #
      # 1. The verifier's own negative controls over its record oracles, run
      #    against the package's SYNTHETIC stand-in adapter. No engine is built,
      #    linked or executed here, so a green result is verifier plumbing and
      #    never product evidence.
      - run: python3 tests/record_draft8/selftest.py
      # 2. The PRODUCT observation. The real engine is linked into the
      #    mechanical adapter in tests/record_adapter, driven through every
      #    published case, and judged by the package's own check functions,
      #    imported unmodified. A green result is a raw observation for blind
      #    Verification disposition — never acceptance, never a listened golden,
      #    and it observes no PCM at all: the VO08 envelope carries no chunk data.
      #
      #    Verification PR #39 corrected the ARMED-BUSY verifier contradiction;
      #    this is now an ordinary all-cases product run with no exception.
      - run: make -C engine all
      - run: make -C tests/record_adapter all
      # #345 (the #320 pattern): regenerate on the current engine into a fresh
      #    directory and require byte-identity with the in-tree p1-r25-product
      #    bytes, which are never rewritten here.
      - run: >
          python3 tests/record_adapter/run_product.py
          --evidence tests/record_adapter/evidence/product
          --retained tests/record_adapter/evidence/p1-r25-product


  transport-package:
    name: independent transport/warm package — synthetic self-checks, then product observations
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/transport_draft8/selftest.py
      - run: make -C engine all
      - run: make -C tests/transport_adapter all
      - run: python3 tests/transport_adapter/run_product.py --evidence tests/transport_adapter/evidence/p1-r25-product
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-r25-transport-product-evidence
          path: tests/transport_adapter/evidence/p1-r25-product
          if-no-files-found: error

  promote-package:
    name: independent promote package — synthetic self-checks, then product observations
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && (needs.changes.outputs.qualify != 'false' || contains(needs.changes.outputs.qualify_jobs, ',promote-package,')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # run_product.py checks the declared base/import against history.
          fetch-depth: 0
      # R29-A (#261): the final corrected full promote crash/resume + WP-12a
      # package. Self-checks first, then the exact 44,307-case canonical campaign.
      - run: python3 tests/promote_draft8/selftest.py
      - run: make -C engine clean all
      - name: Build mechanical R29-A product binding and retain command log
        run: |
          set -o pipefail
          make -C tests/promote_adapter clean all 2>&1 | tee tests/promote_adapter/build.log
      - name: Run exact 44,307-case canonical package until PASS or first retained failure
        run: python3 tests/promote_adapter/run_product.py --evidence tests/promote_adapter/evidence/p1-r38-product
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      # Not canonical: every case through the same adapter and oracle, every
      # failure recorded, so one round shows the whole picture.
      - name: Diagnostic sweep of all 44,307 cases (non-canonical)
        if: always()
        run: python3 tests/promote_adapter/diagnostic_sweep.py --out tests/promote_adapter/evidence/p1-r38-product/diagnostic
      # B6: raw setup bytes for every crafted-counter case, audited against the
      # verifier fixtures, with red controls that must be rejected.
      - name: B6 crafted-counter raw setup audit and red controls
        if: always()
        run: python3 tests/promote_adapter/b6_setup_audit.py --out tests/promote_adapter/evidence/p1-r38-product/b6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-r38-promote-product-evidence
          path: tests/promote_adapter/evidence/p1-r38-product
          if-no-files-found: error

  respool-package:
    name: independent respool package — synthetic self-checks, then full 8-case product observations
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/respool_draft8/selftest.py
      - run: make -C engine all
      - run: make -C tests/respool_adapter all
      - run: python3 tests/respool_adapter/run_product.py --evidence tests/respool_adapter/evidence/p1-r25-product
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-r25-respool-product-evidence
          path: tests/respool_adapter/evidence/p1-r25-product
          if-no-files-found: error

  format-dup-package:
    name: independent format/dup package — synthetic self-checks, then product observations
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/format_dup_draft8/selftest.py
      - run: make -C engine all
      - run: make -C tests/format_dup_adapter all
      - name: Prove rejected raw-operation callbacks remain observable
        run: tests/format_dup_adapter/build/wp_fmt_dup_probe --selfcheck-callback-trace
      - run: python3 tests/format_dup_adapter/run_product.py --evidence tests/format_dup_adapter/evidence/p1-r25-product
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
