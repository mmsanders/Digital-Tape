name: engine gates

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: engine gates (golden suite red until WP-10 fixtures land)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          cc --version
          objdump --version | head -1
          nm --version | head -1

      # Every gate runs and reports, rather than stopping at the first failure.
      # Six of seven gates pass. The golden suite is red because tests/golden/
      # is empty, and those fixtures are the Verification Lead's (WP-10/WP-11) —
      # not something this repo can or should satisfy on its own.
      #
      # Do not "fix" that by relaxing a gate, and do not let red become the
      # background: every other gate is green, so a new failure here is real.
      - name: Run all gates
        run: ./tools/ci/all.sh
