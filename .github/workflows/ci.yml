  slot-package:
    name: independent WP-36 slot package — synthetic self-checks, then debug-assert product observations
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/slot_draft8/selftest.py
      - name: Build engine with debug dev_write assertion enabled
        run: |
          make -C engine clean
          make -C engine all CFLAGS=-UNDEBUG
      - run: make -C tests/slot_adapter all
      - run: python3 tests/slot_adapter/run_product.py --evidence tests/slot_adapter/evidence/p1-r25-product
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-r25-slot-product-evidence
          path: tests/slot_adapter/evidence/p1-r25-product
          if-no-files-found: error

  wp36-fuzz-package:
    name: independent WP-36 100k source-slot fuzz — debug real-product observations
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && (needs.changes.outputs.qualify != 'false' || contains(needs.changes.outputs.qualify_jobs, ',wp36-fuzz-package,')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/wp36_fuzz_draft8/selftest.py
      - name: Build engine with debug dev_write assertion enabled
        run: |
          make -C engine clean
          make -C engine all CFLAGS=-UNDEBUG
      - run: make -C tests/wp36_fuzz_adapter all
      - run: python3 tests/wp36_fuzz_adapter/run_product.py --evidence tests/wp36_fuzz_adapter/evidence/p1-r26-product
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-r26-wp36-100k-product-evidence
          path: tests/wp36_fuzz_adapter/evidence/p1-r26-product
          if-no-files-found: error

  embedded-readiness-package:
    # DRAFT-9 (#243/#247) replaced the three-funnel WP13-G5 with four named
    # funnels. The product is measured against the DRAFT-9 package; the
    # accepted DRAFT-8 package and its collector stay in the tree unchanged.
    # DRAFT-10 (#359, ADR-153): the WP-13 row is byte-identical to DRAFT-9's, so
    # the DRAFT-9 package still audits the product under the issued bundle.
    name: independent WP-13 embedded-readiness audit (DRAFT-9) — six-gate real-product evidence
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # the collector checks the declared base/import against history
          fetch-depth: 0
      - run: python3 tests/embedded_readiness_draft9/selftest.py
      - name: Toolchain, including the clang AST call-expression scanner
        run: cc --version | head -1; clang --version | head -1
      - run: python3 -m py_compile tests/embedded_readiness_adapter/collect_product_evidence_draft9.py
      # #359: the issued bundle is accepted only while its WP-13 row is DRAFT-9's.
      - run: python3 -B tools/ci/verify-wp13-carryover-gate.py
      - run: python3 tests/embedded_readiness_adapter/collect_product_evidence_draft9.py --evidence tests/embedded_readiness_adapter/evidence/p1-r34-draft9-product
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-r34-wp13-draft9-embedded-readiness-evidence
          path: tests/embedded_readiness_adapter/evidence/p1-r34-draft9-product
          if-no-files-found: error

  allocator-cow-package:
    name: independent WP-07 allocator/COW — fixed 10k real-product campaign
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && (needs.changes.outputs.qualify != 'false' || contains(needs.changes.outputs.qualify_jobs, ',allocator-cow-package,')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: python3 tests/allocator_cow_draft8/selftest.py
      - run: make -C engine clean all
      - name: Build product adapter and retain command log
        run: |
          set -o pipefail
          make -C tests/allocator_cow_adapter clean all 2>&1 | tee tests/allocator_cow_adapter/build.log
      - run: python3 tests/allocator_cow_adapter/run_product.py --evidence tests/allocator_cow_adapter/evidence/p1-r27-product
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-r27-wp07-allocator-cow-evidence
          path: tests/allocator_cow_adapter/evidence/p1-r27-product
          if-no-files-found: error

  crash-core-package:
    name: independent WP-10 core crash — bounded real-product campaign
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && (needs.changes.outputs.qualify != 'false' || contains(needs.changes.outputs.qualify_jobs, ',crash-core-package,')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: python3 tests/crash_core_draft8/selftest.py
      - run: python3 tests/crash_core_adapter/test_provenance.py
      - run: make -C engine clean all
      - name: Build product crash adapter and retain command log
        run: |
          set -o pipefail
          make -C tests/crash_core_adapter clean all 2>&1 | tee tests/crash_core_adapter/build.log
      - name: Run fixed bounded WP-10 core crash campaign
        run: python3 tests/crash_core_adapter/run_product.py --evidence tests/crash_core_adapter/evidence/p1-r27-product
        env:
          PRODUCT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-r27-wp10-core-crash-evidence
          path: tests/crash_core_adapter/evidence/p1-r27-product
          if-no-files-found: error

  format-dup-identity-package:
    name: R29-B format/duplicate raw identity + dup long-op — exact canonical product campaign
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && (needs.changes.outputs.qualify != 'false' || contains(needs.changes.outputs.qualify_jobs, ',format-dup-identity-package,')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # run_product.py checks the declared base/import against history.
