name: engine gates

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: engine gates (expected red until WP-06/WP-10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          cc --version
          objdump --version | head -1
          nm --version | head -1

      # Every gate runs and reports, rather than stopping at the first failure.
      # This is expected to fail at Phase 0 — that is the WP-04 acceptance
      # criterion, not a defect. Guardrails that arrive after the code has been
      # written are advisory; guardrails that are already failing are load-bearing.
      # Do not "fix" this by relaxing a gate. See docs/STATUS.md.
      - name: Run all gates
        run: ./tools/ci/all.sh
