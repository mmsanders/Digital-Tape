name: APP-1A S1 ingest report (#452)

# Software's own checks of the opt-in ingest report candidate, stacked on HELD INGEST-1
# candidate 6126d04 (#436). Only the scopes the change touches are rerun, never the
# full Stage1 campaign (ingest.yml's stage1-packet job is skipped for this branch):
#   - unit/integration tests;
#   - the shipping binary still carries no observation seam;
#   - no-flag equivalence: base 6126d04 vs this candidate, byte for byte, on every
#     census case whose setup needs no test-build seam and is at most an hour long;
#   - with --report: identical outputs, and an APP-1A-shaped report.
# Judges nothing; Verification #196 authors and runs the tests that dispose it.
on:
  pull_request:
    paths:
      - 'host/ingest/**'
      - 'tools/app1a/**'
      - '.github/workflows/app1a-s1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s1:
    name: S1 report candidate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: check out bytes exactly as committed
        working-directory: ${{ runner.temp }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: 6126d04050133cacb9a1960a0bc13c9ee93130e5
          path: base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: source pack (the package's own fetcher)
        run: |
          python -m pip install -r tests/wp16_ingest_stage1/requirements.txt
          python -B tests/wp16_ingest_stage1/check_pins.py
          python -B tests/wp16_ingest_stage1/asset.py --destination "$RUNNER_TEMP/sources"
      - name: build base and candidate (shipping and observation)
        run: |
          (cd base/host/ingest && cargo build --release --locked)
          (cd host/ingest && cargo build --release --locked && cargo build --release --locked --features observe --target-dir target/observe)
      - name: binary identities
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          for b in base/host/ingest/target/release/ingest$ext host/ingest/target/release/ingest$ext host/ingest/target/observe/release/ingest$ext; do
            s=$(python -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$b")
            echo "$s  $b"; echo "::notice title=${{ runner.os }} $b::$s"
          done
      - name: tests
        working-directory: host/ingest
        run: cargo test --release --locked
      - name: shipping binary carries no observation seam
        working-directory: host/ingest
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          python -B tools/check_seam.py target/release/ingest$ext target/observe/release/ingest$ext
      - name: no-flag equivalence and report shape
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          python -B tools/app1a/noflag_equivalence.py --package tests/wp16_ingest_stage1 --sources "$RUNNER_TEMP/sources" \
            --base base/host/ingest/target/release/ingest$ext --new host/ingest/target/release/ingest$ext \
            --out "$RUNNER_TEMP/eq/noflag-equivalence-${{ runner.os }}.json" --work "$RUNNER_TEMP/eqwork"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app1a-s1-${{ runner.os }}
          path: ${{ runner.temp }}/eq
