name: hardware

on:
  push:
    branches: ["**"]
    paths: ["hardware/**", "spec/hw/**", "tools/ci/audit-hardware.sh", ".github/workflows/hardware.yml"]
  pull_request:
    paths: ["hardware/**", "spec/hw/**", "tools/ci/audit-hardware.sh", ".github/workflows/hardware.yml"]
  workflow_dispatch:

# For the Hardware Lead (PM Decisions 002-HW §2). Runs only when hardware/
# changes, so board checks do not gate engine work and vice versa.
#
# The solenoid, thermal, clasp, library-print-packet and old cartridge-shell
# CAD checks were retired from CI on 16 November 2026: they guarded the design
# superseded on 1-2 November (docs/DEVICE-DESIGN.md §7). Their make targets
# remain in hardware/Makefile and still run by hand. The fabrication gate and
# the atomicity judge stay.
jobs:
  erc-drc:
    name: KiCad ERC / DRC
    runs-on: ubuntu-latest
    container:
      # Pinned. A floating tag would change the rule set under a board that
      # passed yesterday, and "the DRC changed" is not a debuggable failure.
      image: ghcr.io/kicad/kicad:8.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: kicad-cli --version
      - run: ./tools/ci/audit-hardware.sh
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-reports
          path: build/hardware/
          if-no-files-found: ignore

  packet:
    name: hardware gates
    runs-on: ubuntu-latest
    # Deliberately NOT the KiCad container: these gates are pure stdlib and fast.
    steps:
      - uses: actions/checkout@v4
      # PINNED, and it is not cosmetic. Python 3.12 changed `sum()` to
      # compensated summation for floats, which moved a load subtotal across a
      # 0.5 mW rounding boundary -- so a committed document was stale on the
      # runner and fresh on the author's machine. The generators now quantise to
      # integer microwatts so that specific class is gone, but a committed
      # artefact checked by CI should not depend on whatever the runner image
      # happens to ship either way.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Media-atomicity judge, and proof it can go red
        run: make -C hardware atomicity-test
      - name: Fabrication gate preserves CLOSED at the Make boundary
        run: make -C hardware fabrication-gate-test
      - name: spec/hw content and revision agree
        run: make -C hardware spec-check
