# STAGED / INERT: intentionally outside .github/workflows/.
# Agents request work by adding state:ready. Only this cheap gate promotes a
# validated child to state:queued. Expensive listeners watch state:queued only.

name: Agent Bus - Validate Ready

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-bus-ready-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.event.label.name == 'state:ready' && contains(github.event.issue.labels.*.name, 'agent-task')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      CHATGPT_WORKER_ENABLED: ${{ vars.AGENT_BUS_CHATGPT_WORKER_ENABLED }}
      GROK_WORKER_ENABLED: ${{ vars.AGENT_BUS_GROK_WORKER_ENABLED }}
      VERIFICATION_ENABLED: ${{ vars.AGENT_BUS_VERIFICATION_ENABLED }}
    steps:
      - name: Validate envelope, budgets, parentage, and adapters
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          reject() {
            reason="$1"
            echo "REJECT: $reason" >&2
            # Remove the requested dispatch before marking the durable error.
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label 'state:ready' || true
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label 'state:protocol-error' || true
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
              "<!-- AGENT-BUS-REJECT --> Dispatch rejected by the cheap protocol gate: **${reason}**. No model should claim this task."
            echo 'ok=false' >> "$GITHUB_OUTPUT"
            exit 0
          }

          issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}")"
          labels="$(jq -r '.labels[].name' <<<"$issue")"

          grep -Fxq 'agent-task' <<<"$labels" || reject 'missing agent-task label'
          grep -Fxq 'state:ready' <<<"$labels" || { echo 'ready already consumed; no-op'; echo 'ok=false' >> "$GITHUB_OUTPUT"; exit 0; }
          grep -Fxq 'round:active' <<<"$labels" || reject 'task is not in the active round'
          if grep -Fxq 'agent-root' <<<"$labels"; then
            reject 'lead roots are released only by human authorization or the fan-in barrier; agents may not ready them'
          fi

          # Exactly one lifecycle label, and it must be ready.
          lifecycle="$(grep -E '^state:(draft|ready|queued|working|waiting|review|blocked|protocol-error)$' <<<"$labels" || true)"
          [[ "$(grep -c . <<<"$lifecycle" || true)" -eq 1 ]] || reject 'task must have exactly one lifecycle state before dispatch'

          destinations="$(grep -E '^to:(pm|software|hardware|verification|worker-chatgpt|worker-grok)$' <<<"$labels" || true)"
          [[ "$(grep -c . <<<"$destinations" || true)" -eq 1 ]] || reject 'task must have exactly one destination'
          destination="$(head -n1 <<<"$destinations")"
          [[ "$destination" != 'to:pm' ]] || reject 'PM never accepts queued work from agents'

          # One active round and protected-workflow proof.
          rounds="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label 'agent-round' --label 'round:active' --json number,labels --limit 10)"
          [[ "$(jq 'length' <<<"$rounds")" -eq 1 ]] || reject 'expected exactly one active Agent Bus round'
          round="$(jq -r '.[0].number' <<<"$rounds")"
          round_labels="$(jq -r '.[0].labels[].name' <<<"$rounds")"
          grep -Fxq 'round:authorized' <<<"$round_labels" || reject 'active round lacks authorization label'
          comments="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${round}/comments?per_page=100")"
          proof="$(jq '[.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- AGENT-BUS-AUTH -->"))] | length' <<<"$comments")"
          [[ "$proof" -ge 1 ]] || reject 'active round lacks protected human-gate authorization proof'

          # Every dispatchable child sits directly under one lead root.
          parent="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/parent" 2>/dev/null || true)"
          [[ -n "$parent" ]] || reject 'non-root task is missing native GitHub parent'
          parent_number="$(jq -r '.number' <<<"$parent")"
          parent_labels="$(jq -r '.labels[].name' <<<"$parent")"
          grep -Fxq 'agent-root' <<<"$parent_labels" || reject 'task depth exceeds round -> root -> child'
          grep -Fxq 'round:active' <<<"$parent_labels" || reject 'parent root is not in active round'

          # Parent root must itself belong to the active round.
          grandparent="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${parent_number}/parent" 2>/dev/null || true)"
          [[ -n "$grandparent" ]] || reject 'parent root is not attached to an agent-round'
          [[ "$(jq -r '.number' <<<"$grandparent")" == "$round" ]] || reject 'task belongs to a different round tree'

          parent_dest="$(grep -E '^to:(software|hardware|verification)$' <<<"$parent_labels" || true)"
          [[ "$(grep -c . <<<"$parent_dest" || true)" -eq 1 ]] || reject 'parent root has invalid lead destination'

          # Hard child-count fuse.
          siblings="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${parent_number}/sub_issues?per_page=100")"
          [[ "$(jq 'length' <<<"$siblings")" -le 12 ]] || reject 'parent exceeds hard cap of 12 child tasks'

          # Legal destination from this parent. Independent Verification is a typed exception.
          if grep -Fxq 'kind:independent-review' <<<"$labels"; then
            [[ "$parent_dest" == 'to:software' || "$parent_dest" == 'to:hardware' ]] || reject 'only Software/Hardware roots may request typed independent review'
            [[ "$destination" == 'to:verification' ]] || reject 'typed independent review must target Verification'
            [[ "$VERIFICATION_ENABLED" == 'true' ]] || reject 'Verification adapter/listener is not enabled'
            review_count="$(jq '[.[] | [.labels[].name] | select(index("kind:independent-review"))] | length' <<<"$siblings")"
            [[ "$review_count" -le 2 ]] || reject 'parent exceeds hard cap of 2 independent-review service calls'
          else
            [[ "$destination" == 'to:worker-chatgpt' || "$destination" == 'to:worker-grok' ]] || reject 'lead child must target a worker unless it is typed independent review'
          fi

          if [[ "$destination" == 'to:worker-chatgpt' && "$CHATGPT_WORKER_ENABLED" != 'true' ]]; then
            reject 'ChatGPT-chat worker adapter is not enabled'
          fi
          if [[ "$destination" == 'to:worker-grok' && "$GROK_WORKER_ENABLED" != 'true' ]]; then
            reject 'Grok worker adapter is not enabled'
          fi

          # Count prior actual dispatches, not persistent comments. Three queued
          # cycles is the hard fuse for a child, including initial execution.
          events="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/events?per_page=100")"
          queued_count="$(jq '[.[] | select(.event == "labeled") | select(.label.name == "state:queued")] | length' <<<"$events")"
          [[ "$queued_count" -lt 3 ]] || reject 'child has exhausted the hard cap of 3 dispatch/claim cycles'

          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Promote ready to queued
        if: steps.gate.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Never expose queued while another lifecycle state remains.
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label 'state:ready'
          # Dispatch edge is deliberately the final mutation.
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label 'state:queued'
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
            "<!-- AGENT-BUS-DISPATCH --> Envelope passed protocol/budget checks and is queued for its destination."
