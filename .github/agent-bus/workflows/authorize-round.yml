# STAGED / INERT: intentionally outside .github/workflows/.
# Activation copies it into .github/workflows/ only after the GitHub Environment
# `michael-round-gate` exists with Michael as required reviewer.

name: Agent Bus - Authorize Round

on:
  workflow_dispatch:
    inputs:
      round_issue:
        description: "Agent Round issue number"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-bus-round-authorization
  cancel-in-progress: false

jobs:
  authorize:
    # Hard human barrier. An agent may start the workflow, but this job cannot
    # execute until the required reviewer approves the environment deployment.
    environment: michael-round-gate
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ROUND_ISSUE: ${{ inputs.round_issue }}
    steps:
      - name: Verify one bounded draft and its prepared roots
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ROUND_ISSUE}")"
          labels="$(jq -r '.labels[].name' <<<"$issue")"
          grep -Fxq 'agent-round' <<<"$labels" || { echo 'not an agent-round issue' >&2; exit 1; }

          # No different round may already be active.
          active="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label 'agent-round' --label 'round:active' --json number --limit 10)"
          other_active="$(jq --argjson n "$ROUND_ISSUE" '[.[] | select(.number != $n)] | length' <<<"$active")"
          [[ "$other_active" -eq 0 ]] || { echo 'another Agent Bus round is already active' >&2; exit 1; }

          # A fresh authorization is draft. A rerun may resume the exact same
          # already-authorized round after a failed root-release step.
          if grep -Fxq 'round:draft' <<<"$labels"; then
            echo 'resume=false' >> "$GITHUB_OUTPUT"
          elif grep -Fxq 'round:authorized' <<<"$labels" && grep -Fxq 'round:active' <<<"$labels"; then
            comments="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ROUND_ISSUE}/comments?per_page=100")"
            proof="$(jq '[.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- AGENT-BUS-AUTH -->"))] | length' <<<"$comments")"
            [[ "$proof" -ge 1 ]] || { echo 'authorization labels lack protected-workflow proof' >&2; exit 1; }
            echo 'resume=true' >> "$GITHUB_OUTPUT"
          else
            echo 'round is neither draft nor a resumable authorized round' >&2
            exit 1
          fi

          roots="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ROUND_ISSUE}/sub_issues?per_page=100")"
          count="$(jq 'length' <<<"$roots")"
          [[ "$count" -ge 1 && "$count" -le 3 ]] || {
            echo "round must have 1-3 prepared lead roots; found $count" >&2
            exit 1
          }

          # Every direct child of the round is a root and there is at most one
          # root per lead. Already-released roots are valid on resume.
          bad="$(jq '[.[] | {number, labels:[.labels[].name]} | select(
            ((.labels | index("agent-root")) == null) or
            ((.labels | index("agent-task")) == null) or
            (
              (((.labels | index("round:pending")) != null) and ((.labels | index("state:draft")) == null)) and
              (((.labels | index("round:active")) == null) or ((.labels | index("state:queued")) == null))
            )
          )]' <<<"$roots")"
          [[ "$(jq 'length' <<<"$bad")" -eq 0 ]] || {
            echo 'one or more round children are not valid prepared/released roots' >&2
            jq . <<<"$bad" >&2
            exit 1
          }

          destinations="$(jq -r '.[] | [.labels[].name] | map(select(. == "to:software" or . == "to:hardware" or . == "to:verification")) | .[]' <<<"$roots")"
          [[ "$(wc -l <<<"$destinations" | tr -d ' ')" -eq "$count" ]] || {
            echo 'each root must have exactly one lead destination' >&2
            exit 1
          }
          [[ "$(sort <<<"$destinations" | uniq | wc -l | tr -d ' ')" -eq "$count" ]] || {
            echo 'round may contain at most one root per lead' >&2
            exit 1
          }

      - name: Record protected authorization
        if: steps.verify.outputs.resume == 'false'
        shell: bash
        run: |
          set -euo pipefail
          # Record proof before releasing any model work.
          gh issue comment "$ROUND_ISSUE" --repo "$GITHUB_REPOSITORY" --body \
            "<!-- AGENT-BUS-AUTH -->
          Round authorization passed the protected \`michael-round-gate\` environment.

          Authorization run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Initiating actor: ${GITHUB_ACTOR}

          This authorizes only the bounded objectives and root tasks already attached to this round issue. It does not authorize a subsequent round."

          gh issue edit "$ROUND_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --remove-label 'round:draft' \
            --add-label 'round:authorized' \
            --add-label 'round:active'

      - name: Release prepared roots
        shell: bash
        run: |
          set -euo pipefail
          roots="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ROUND_ISSUE}/sub_issues?per_page=100")"
          mapfile -t numbers < <(jq -r '.[].number' <<<"$roots")

          for root in "${numbers[@]}"; do
            issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${root}")"
            labels="$(jq -r '.labels[].name' <<<"$issue")"

            if grep -Fxq 'round:active' <<<"$labels" && grep -Fxq 'state:queued' <<<"$labels"; then
              echo "#$root already released; no-op"
              continue
            fi

            grep -Fxq 'round:pending' <<<"$labels" || { echo "#$root is not pending" >&2; exit 1; }
            grep -Fxq 'state:draft' <<<"$labels" || { echo "#$root is not draft" >&2; exit 1; }
            grep -Fxq 'phase:fanout' <<<"$labels" || { echo "#$root lacks phase:fanout" >&2; exit 1; }

            # Remove holding state first. Dispatch edge is added LAST.
            gh issue edit "$root" --repo "$GITHUB_REPOSITORY" \
              --remove-label 'state:draft' \
              --remove-label 'round:pending' \
              --add-label 'round:active'
            gh issue edit "$root" --repo "$GITHUB_REPOSITORY" --add-label 'state:queued'
          done
