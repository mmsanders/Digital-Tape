# STAGED / INERT: intentionally outside .github/workflows/.
# Marks the round quiescent only when every lead root has returned to PM and all
# child work has been dispositioned/closed. It never starts another round.

name: Agent Bus - Detect Quiescence

on:
  issues:
    types: [labeled, unlabeled, closed, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-bus-quiescence
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find exactly one active authorized round
        id: round
        shell: bash
        run: |
          set -euo pipefail
          rounds="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label 'agent-round' --label 'round:active' --json number,labels --limit 10)"
          count="$(jq 'length' <<<"$rounds")"
          if [[ "$count" -eq 0 ]]; then
            echo 'No active round; nothing to do.'
            echo 'number=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$count" -eq 1 ]] || { echo "expected one active round, found $count" >&2; exit 1; }

          number="$(jq -r '.[0].number' <<<"$rounds")"
          labels="$(jq -r '.[0].labels[].name' <<<"$rounds")"
          grep -Fxq 'round:authorized' <<<"$labels" || { echo 'active round lacks authorization label' >&2; exit 1; }
          if grep -Fxq 'round:pm-review' <<<"$labels" || grep -Fxq 'round:closed' <<<"$labels"; then
            echo 'PM already claimed/closed this round; no-op.'
            echo 'number=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Verify protected authorization provenance
        if: steps.round.outputs.number != ''
        shell: bash
        env:
          ROUND: ${{ steps.round.outputs.number }}
        run: |
          set -euo pipefail
          comments="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ROUND}/comments?per_page=100")"
          proof="$(jq '[.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- AGENT-BUS-AUTH -->"))] | length' <<<"$comments")"
          [[ "$proof" -ge 1 ]] || { echo 'authorization label lacks protected-workflow provenance' >&2; exit 1; }

      - name: Verify every root has returned and every child is closed
        id: work
        if: steps.round.outputs.number != ''
        shell: bash
        env:
          ROUND: ${{ steps.round.outputs.number }}
        run: |
          set -euo pipefail

          roots="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ROUND}/sub_issues?per_page=100")"
          root_count="$(jq 'length' <<<"$roots")"
          [[ "$root_count" -ge 1 && "$root_count" -le 3 ]] || {
            echo "active round has invalid root count: $root_count" >&2
            exit 1
          }

          bad_roots="$(jq '[.[] | {number,state,labels:[.labels[].name]} | select(
            .state != "open" or
            ((.labels | index("agent-root")) == null) or
            ((.labels | index("round:active")) == null) or
            ((.labels | index("to:pm")) == null) or
            (
              ((.labels | index("state:review")) == null) and
              ((.labels | index("state:blocked")) == null)
            )
          )]' <<<"$roots")"

          if [[ "$(jq 'length' <<<"$bad_roots")" -ne 0 ]]; then
            echo 'One or more lead roots have not returned to PM yet.'
            jq . <<<"$bad_roots"
            echo 'quiescent=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # At quiescence the ONLY open active task issues are the returned roots.
          # Leads must disposition/close every worker/review child before returning.
          open_tasks="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label 'agent-task' --label 'round:active' --json number,labels --limit 1000)"
          non_roots="$(jq '[.[] | {number,labels:[.labels[].name]} | select((.labels | index("agent-root")) == null)]' <<<"$open_tasks")"
          if [[ "$(jq 'length' <<<"$non_roots")" -ne 0 ]]; then
            echo 'Child work remains open; round is not quiescent.'
            jq . <<<"$non_roots"
            echo 'quiescent=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [[ "$(jq 'length' <<<"$open_tasks")" -eq "$root_count" ]] || {
            echo 'open active task set does not match returned roots' >&2
            exit 1
          }

          echo 'quiescent=true' >> "$GITHUB_OUTPUT"

      - name: Mark quiescent exactly once
        if: steps.round.outputs.number != '' && steps.work.outputs.quiescent == 'true'
        shell: bash
        env:
          ROUND: ${{ steps.round.outputs.number }}
        run: |
          set -euo pipefail
          labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ROUND}" --jq '.labels[].name')"
          if grep -Fxq 'round:quiescent' <<<"$labels"; then
            echo 'Already quiescent; no-op.'
            exit 0
          fi

          gh issue edit "$ROUND" --repo "$GITHUB_REPOSITORY" --add-label 'round:quiescent'
          gh issue comment "$ROUND" --repo "$GITHUB_REPOSITORY" --body \
            "<!-- AGENT-BUS-QUIESCENT -->
          All lead roots have returned to PM and all child work is closed. The round is quiescent.

          PM may perform one executive review/synthesis for Michael. PM must not dispatch new work or start another round without a new protected human authorization."
