name: Agent Bus Round
about: Plan one bounded PM round; authorization is a separate Michael-only gate
title: "[Agent Round] "
labels: ["agent-round", "round:draft"]
body:
  - type: markdown
    attributes:
      value: |
        This issue defines a **single bounded autonomous round**.
        Creating or editing it does not authorize work. The staged authorization workflow requires Michael's manual approval through the `michael-round-gate` GitHub Environment.

  - type: input
    id: round_id
    attributes:
      label: Round ID
      placeholder: R1
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Executive objective
      description: What should be true when this round returns to PM review?
    validations:
      required: true

  - type: textarea
    id: software
    attributes:
      label: Software Lead root assignment
      description: Leave blank if the Software Lead has no root work this round.
    validations:
      required: false

  - type: textarea
    id: hardware
    attributes:
      label: Hardware Lead root assignment
      description: Leave blank if the Hardware Lead has no root work this round.
    validations:
      required: false

  - type: textarea
    id: verification
    attributes:
      label: Verification Lead root assignment
      description: Leave blank if the Verification Lead has no root work this round.
    validations:
      required: false

  - type: textarea
    id: boundaries
    attributes:
      label: Round boundaries / no-new-scope rule
      description: Explicitly name anything that must be deferred to a later Michael-authorized round.
    validations:
      required: true

  - type: textarea
    id: completion
    attributes:
      label: Round completion test
      description: Observable conditions the PM will use before declaring the bus quiescent.
      placeholder: |
        - All root tasks returned to PM review or closed
        - No queued/working/blocked child work remains
        - No protocol errors remain
    validations:
      required: true

  - type: checkboxes
    id: token_policy
    attributes:
      label: Token policy
      options:
        - label: Root assignments reserve frontier-model work for planning, judgment, integration, or independent verification and delegate bounded execution when practical.
          required: true
        - label: This round will stop at PM review and will not automatically start another round.
          required: true
