[package]
name = "digital-tape-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Digital Tape WP-15 one-window app (APP-1 / APP-1A): runs the bundled ingest and tapectl as children"
license = "MIT"
publish = false
build = "build.rs"

[[bin]]
name = "digital-tape"
path = "src/main.rs"

[lib]
name = "dtapp"
path = "src/lib.rs"

[dependencies]
tauri = { version = "=2.12.4", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
getrandom = "0.3"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[profile.release]
panic = "abort"
overflow-checks = true

[workspace]
